services:
  # Local Postgres — offline dev only. RDS is the shared team DB.
  # Start with: docker compose --profile local-db up -d
  # Don't run alongside the bastion SSH tunnel (both bind port 5433).
  db:
    image: postgres:15
    profiles: [local-db]
    environment:
      POSTGRES_DB: portalpoint
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.0-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
