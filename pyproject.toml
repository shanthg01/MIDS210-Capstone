[project]
name = "portalpoint"
version = "0.1.0"
description = "Transfer portal decision platform for college basketball"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "redis[asyncio]>=5.0.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.0.0",
    "httpx>=0.27.0",
    "alembic>=1.13.0",
    "requests>=2.34.2",
    "pandas>=2.2.0,<3.0.0",
    "psycopg2-binary>=2.9.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "numpy>=1.26.0",
    "ipykernel>=6.29.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.11.0",
    "pyarrow>=16.0.0",
    "notebook (>=7.5.7,<8.0.0)",
    "mlflow>=3.14.0",
    "boto3>=1.43.33",
    "curl-cffi>=0.15.0",
    "lightgbm>=4.6.0",
    "shap>=0.51.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portalpoint"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning",
]
